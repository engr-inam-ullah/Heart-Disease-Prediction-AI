<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | HeartCare AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="heart-ecg" viewBox="0 0 64 60">
            <path d="M32 56C10 40 2 28 2 17 2 8 9 2 17 2c6 0 11 3 15 9 4-6 9-9 15-9 8 0 15 6 15 15 0 11-8 23-30 39z"
                fill="#e11d48" />
            <path d="M6 28h13l5-10 8 20 6-14 4 4h16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"
                stroke-linejoin="round" />
        </symbol>
    </svg>

    <img src="images/heart-background.png" alt="" class="bg-heart">

    <header class="topbar">
        <a class="brand" href="/">
            <svg class="logo">
                <use href="#heart-ecg" />
            </svg>
            <span class="brand-text">
                <strong>HeartCare <em>AI</em></strong>
                <small>Smarter Insights. Healthier Hearts.</small>
            </span>
        </a>
        <nav>
            <a href="/login">Login</a>
            <a href="/signup">Sign up</a>
        </nav>
    </header>

    <main class="layout">
        <div class="spacer"></div>

        <section class="card" aria-labelledby="t">
            <svg class="card-heart">
                <use href="#heart-ecg" />
            </svg>
            <h1 id="t">Create <span>Account</span></h1>
            <p class="lead">Sign up to use the heart disease prediction.</p>

            <div id="error" class="error" role="alert" hidden></div>

            <form id="signupForm" action="/signup" method="POST" novalidate>
                <label for="name">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
                    </svg>
                    Full name
                </label>
                <input type="text" id="name" name="name" placeholder="Enter your name" autocomplete="name" required>

                <label for="email">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="14" rx="2" />
                        <path d="m3 7 9 6 9-6" />
                    </svg>
                    Email
                </label>
                <input type="text" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>

                <label for="password">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="10" width="16" height="11" rx="2" />
                        <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                    </svg>
                    Password
                </label>
                <div class="pw">
                    <input type="password" id="password" name="password" placeholder="At least 6 characters"
                        autocomplete="new-password" required>
                    <button type="button" id="toggle" class="toggle" aria-label="Show password">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>

                <label for="confirm">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="10" width="16" height="11" rx="2" />
                        <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                    </svg>
                    Confirm password
                </label>
                <input type="password" id="confirm" name="confirm" placeholder="Enter password again"
                    autocomplete="new-password" required>

                <div class="row"></div>
                <button type="submit" class="btn">Create account</button>
            </form>
            <p class="foot">Already have an account? <a href="/login" class="link">Log in</a></p>
        </section>
    </main>

    <script>
        const pw = document.getElementById('password'), tg = document.getElementById('toggle'),
            err = document.getElementById('error');
        const show = m => { err.textContent = m; err.hidden = false; };

        tg.addEventListener('click', () => {
            const s = pw.type === 'password';
            pw.type = s ? 'text' : 'password';
            tg.setAttribute('aria-label', s ? 'Hide password' : 'Show password');
            tg.classList.toggle('on', s);
        });

        document.getElementById('signupForm').addEventListener('submit', e => {
            const n = document.getElementById('name').value.trim();
            const m = document.getElementById('email').value.trim();
            const c = document.getElementById('confirm').value;
            if (!n || !m || !pw.value) { e.preventDefault(); return show('Fill in all the fields.'); }
            if (!/^\S+@\S+\.\S+$/.test(m)) { e.preventDefault(); return show('Enter a valid email address.'); }
            if (pw.value.length < 6) { e.preventDefault(); return show('Password must be at least 6 characters.'); }
            if (pw.value !== c) { e.preventDefault(); return show('Passwords do not match.'); }
        });

        const msgs = {
            exists: 'This email is already registered. Log in instead.',
            empty: 'Fill in all the fields.',
            short: 'Password must be at least 6 characters.',
            match: 'Passwords do not match.',
            server: 'Something went wrong. Check the server terminal.'
        };
        const q = new URLSearchParams(location.search).get('error');
        if (q && msgs[q]) show(msgs[q]);
    </script>
</body>

</html>
